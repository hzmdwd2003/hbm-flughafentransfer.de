    <!-- M überlappt das B leicht; gemeinsamer Rhythmus ohne Zusatzsymbol -->
    <path d="M149 8h20l22 39 22-39h19v88h-18V40l-17 30h-13l-17-30v56h-18V8Z"/>
  </g>
</svg>
