<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 104" role="img" aria-labelledby="title desc">
  <title id="title">HBM</title>
  <desc id="desc">Schwarzes HBM Wortzeichen mit verbundenen Buchstaben</desc>
